{% extends 'base/base.html' %}
{% load static %}

{% block title %}Registrar Escuela | CityAir Logs{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">

    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="fw-bold mb-0" style="color: #1e1e2f;">
            <i class="bi bi-building-add me-2" style="color: #4caf50;"></i>Registrar Escuela
        </h2>
        <a href="{% url 'escuelas' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nombre de la escuela</label>
                    <input type="text" name="nombre" class="form-control" required placeholder="ej. Instituto Tecnológico de Xalapa">
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Municipio</label>
                        <input type="text" name="municipio" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estado</label>
                        <input type="text" name="estado" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nivel educativo</label>
                    <select name="nivel" class="form-select" required>
                        {% for value, label in nivel_choices %}
                            <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Clave de centro de trabajo <span class="text-muted fw-normal">(opcional)</span></label>
                    <input type="text" name="clave_centro_trabajo" class="form-control" placeholder="ej. 30EIT0001W">
                </div>

                <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-check-circle me-1"></i> Registrar escuela
                </button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
